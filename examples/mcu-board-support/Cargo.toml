# cSpell: ignore framebuf sitronix xspi

# Own workspace: the board HALs pulled in by the different board features
# (esp-hal, rp235x-hal, ...) require mutually incompatible versions of the
# `riscv-rt` link crate, so they cannot all be resolved together in the shared
# examples lock file. Building one board at a time (via the demos workspace)
# keeps only a single board's dependencies in the graph. It shares the
# repository `target/` directory via the root `.cargo/config.toml`.
[workspace]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
i-slint-core = { version = "=1.18.0", path = "../../internal/core", default-features = false }
i-slint-renderer-software = { version = "=1.18.0", path = "../../internal/renderers/software", default-features = false }
derive_more = { version = "2.0.0", default-features = false, features = ["deref", "deref_mut", "into", "from", "add", "add_assign", "mul", "not", "display"] }

[package]
name = "mcu-board-support"
version = "1.18.0"
authors = ["Slint Developers <info@slint.dev>"]
edition.workspace = true
license = "MIT"
publish = false
description = "Internal helper that includes support for different MCUs, for use in Slint examples"
repository = "https://github.com/slint-ui/slint"
homepage = "https://slint.dev"
links = "mcu_board_support"                                                                         # just so we can pass metadata to the slint build crate

[lib]
path = "lib.rs"

