[dependencies]
slint = { version = "=1.18.0", path = "../../api/rs/slint", default-features = false, features = ["compat-1-2", "renderer-software"] }
i-slint-core = { workspace = true }
i-slint-core-macros = { version = "=1.18.0", path = "../../internal/core-macros" }
i-slint-renderer-software = { workspace = true, optional = true }

derive_more = { workspace = true }
embedded-graphics = { version = "0.8", optional = true }
once_cell = { version = "1.9", default-features = false, features = ["alloc"] }
pin-weak = { version = "1", default-features = false }
rgb = "0.8.27"
cfg-if = "1"

log = "0.4.27"

embedded-alloc = { version = "0.6", optional = true }
cortex-m-rt = { version = "0.7", optional = true }
cortex-m = { version = "0.7.2", optional = true }
embedded-hal = { version = "1.0.0", optional = true }
embedded-hal-nb = { version = "1.0.0", optional = true }
embedded-hal-bus = { version = "0.3.0", optional = true }
embedded-dma = { version = "0.2.0", optional = true }
rp-pico = { version = "0.9.0", optional = true }
rp235x-hal = { version = "0.4.0", default-features = false, optional = true }
fugit = { version = "0.3.6", optional = true }
euclid = { version = "0.22", default-features = false, optional = true }

stm32h7xx-hal = { version = "0.16.0", optional = true, features = ["log-rtt", "ltdc", "xspi"] }
getrandom = { version = "0.2", optional = true, default-features = false, features = ["custom"] }
embedded-time = { version = "0.12.0", optional = true }
embedded-display-controller = { version = "0.2.0", optional = true }
ft5336 = { version = "0.2", optional = true }

# The whole esp stack is held on the esp-hal 1.1 release line: sh8601-rs (Waveshare AMOLED)
# activates esp-hal 1.1-line crates and blocks moving to esp-hal 1.2 / esp-sync 0.3.
# The tilde pin keeps esp-hal from floating to 1.2, which drags in a second esp-sync
# that fails to build. Move everything to the 1.2 line together once sh8601-rs updates.
esp-hal = { version = "~1.1.1", optional = true }
esp-alloc = { version = "0.10.0", optional = true }
esp-println = { version = "0.17.0", default-features = false, features = ["auto", "log-04"], optional = true }
esp-backtrace = { version = "0.19.0", optional = true, features = ["esp32s3", "println"] }
static_cell = { version = "2.1.1", optional = true }
esp-bootloader-esp-idf = { version = "0.5.0", optional = true }

mipidsi = { version = "0.10.0", optional = true }
embedded-graphics-core = { version = "0.4", optional = true }
embedded-graphics-framebuf = { version = "0.5.0", optional = true }
eeprom24x = { version = "0.7.2", optional = true }

defmt-rtt = { version = "0.4.0", optional = true }
defmt = { version = "1.0.0", optional = true }
defmt-serial = { version = "0.11.0", optional = true }
panic-probe = { version = "0.3.0", optional = true, features = ["print-defmt"] }

embassy-stm32 = { version = "0.6.0", optional = true }
embassy-rp = { version = "0.10.0", optional = true, features = ["rp235xa", "time-driver", "critical-section-impl", "binary-info", "defmt", "unstable-pac"] }
embassy-executor = { version = "0.10.0", optional = true, default-features = false }
embassy-time = { version = "0.5.1", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
esp-rtos = { version = "0.3.0", optional = true, features = ["esp32s3", "embassy"] }
gt911 = { version = "0.3.0", optional = true }
sitronix-touch = { version = "0.0.1", optional = true }
sh8601-rs = { version = "0.1.8", features = ["waveshare_18_amoled"], optional = true }
ft3x68-rs = { version = "0.1.2", optional = true }

rand_core = { version = "0.6.3", optional = true }

[build-dependencies]
cfg-if = "1.0.0"
