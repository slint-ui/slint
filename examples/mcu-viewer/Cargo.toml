[package]
name = "mcu-viewer"
version = "1.19.0"
authors = ["Slint Developers <info@slint.dev>"]
edition = "2024"
build = "build.rs"
publish = false
license = "MIT"
description = "Shows on a microcontroller the designs that the Slint live preview sends over USB"

[[bin]]
path = "main.rs"
name = "mcu-viewer"

[features]
simulator = ["slint/renderer-software", "slint/backend-winit", "slint/std", "mcu-board-support/simulator"]
default = ["simulator"]

[dependencies]
mcu-board-support = { path = "../mcu-board-support" }
slint = { path = "../../api/rs/slint", default-features = false, features = ["compat-1-2", "renderer-software", "software-renderer-path"] }
slint-interpreter = { path = "../../internal/interpreter", default-features = false, features = ["internal-mcu-interpreter", "internal", "internal-image-pixel-format-alpha-map"] }
i-slint-compiler = { path = "../../internal/compiler", default-features = false, features = ["serde"] }
i-slint-core = { path = "../../internal/core", default-features = false }
i-slint-live-preview = { path = "../../internal/live-preview", default-features = false, features = ["serial"] }
# The interpreter shows pre-rendered alpha maps as they are, which the renderer must handle.
i-slint-renderer-software = { path = "../../internal/renderers/software", default-features = false, features = ["image-pixel-format-alpha-map"] }
log = "0.4"

# A microcontroller has no std: the interpreter needs this instead
[target.'cfg(target_os = "none")'.dependencies]
slint-interpreter = { path = "../../internal/interpreter", default-features = false, features = ["libm"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
slint-interpreter = { path = "../../internal/interpreter", default-features = false, features = ["std"] }

[build-dependencies]
slint-build = { path = "../../api/rs/build" }

# Keeps its own release profile, see below.
[workspace]

[profile.release]
# The Xtensa LLVM backend fails on the interpreter at "s", "z" and 1 ("Cannot select").
opt-level = 2
debug = true
