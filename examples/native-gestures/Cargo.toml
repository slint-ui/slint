# cSpell: ignore nativegestures
[package]
name = "native-gestures"
version = "1.19.0"
authors = ["Slint Developers <info@slint.dev>"]
edition.workspace = true
publish = false
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "native-gestures"
path = "src/main.rs"

[dependencies]
slint = { path = "../../api/rs/slint", features = ["backend-android-activity-06"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[build-dependencies]
slint-build = { path = "../../api/rs/build" }

# Android settings
[package.metadata.android]
package = "dev.slint.examples.nativegestures"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 36

[package.metadata.android.application]
label = "Native Gestures"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
