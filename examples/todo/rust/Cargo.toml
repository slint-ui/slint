[package]
name = "todo"
version = "1.19.0"
authors = ["Slint Developers <info@slint.dev>"]
edition.workspace = true
build = "build.rs"
publish = false
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]
path = "lib.rs"
name = "todo_lib"

[[bin]]
path = "main.rs"
name = "todo"

[dependencies]
slint = { path = "../../../api/rs/slint", default-features = false, features = ["compat-1-18", "std", "serde", "backend-android-activity-06"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
console_error_panic_hook = "0.1.5"

[build-dependencies]
slint-build = { path = "../../../api/rs/build" }

[features]
default = ["slint/default"]

[dev-dependencies]
i-slint-backend-testing = { workspace = true }

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 36

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
