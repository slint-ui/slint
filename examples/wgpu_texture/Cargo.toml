[package]
name = "wgpu_texture"
version = "1.19.0"
authors = ["Slint Developers <info@slint.dev>"]
edition.workspace = true
build = "build.rs"
license = "MIT"
publish = false

[[bin]]
path = "main.rs"
name = "wgpu_texture"

[lib]
crate-type = ["lib", "cdylib"]
path = "lib.rs"
name = "wgpu_texture_lib"

[dependencies]
slint = { path = "../../api/rs/slint", features = ["unstable-wgpu-30", "backend-android-activity-06"] }
bytemuck = { workspace = true }
wgpu-30 = { workspace = true, features = ["wgsl"] }

[build-dependencies]
slint-build = { path = "../../api/rs/build" }

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 36

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
