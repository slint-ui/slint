[package]
name = "vulkan_texture"
version = "1.18.0"
authors = ["Slint Developers <info@slint.dev>"]
edition.workspace = true
build = "build.rs"
license = "MIT"
publish = false

[[bin]]
path = "main.rs"
name = "vulkan_texture"

[dependencies]
# Vulkan is only the backend wgpu picks by default on Linux, so the other platforms take an
# opt-in: `renderer-skia-vulkan` builds wgpu's Vulkan backend on macOS and iOS, where it runs on
# MoltenVK, and on Windows, where the default is D3D12. On Windows this makes Skia compile from
# source, as the prebuilt Skia binaries carry no Vulkan build.
slint = { path = "../../api/rs/slint", features = [
  "unstable-wgpu-30",
  "renderer-skia",
  "renderer-skia-vulkan",
] }
wgpu-30 = { workspace = true }
ash = "^0.38.0"

[build-dependencies]
slint-build = { path = "../../api/rs/build" }
