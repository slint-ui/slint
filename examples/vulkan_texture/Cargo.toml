[package]
name = "vulkan_texture"
version = "1.18.0"
authors = ["Slint Developers <info@slint.dev>"]
edition.workspace = true
build = "build.rs"
license = "MIT"
publish = false

[[bin]]
path = "main.rs"
name = "vulkan_texture"

[dependencies]
# `wgpu-30-vulkan-portability` builds wgpu's Vulkan backend on macOS and iOS, where it runs on
# MoltenVK. It resolves to nothing on the platforms that have Vulkan natively.
slint = { path = "../../api/rs/slint", features = [
  "unstable-wgpu-30",
  "renderer-skia",
  "wgpu-30-vulkan-portability",
] }
wgpu-30 = { workspace = true }
ash = "^0.38.0"

[build-dependencies]
slint-build = { path = "../../api/rs/build" }
