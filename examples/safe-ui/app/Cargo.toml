[package]
name = "slint-safeui-app"
version = "1.18.0"
edition = "2024"
publish = false
build = "build.rs"
license = "MIT"

[lib]
name = "slint_safeui_app"
path = "src/lib.rs"

[features]
# Slint's no_std math needs either libm or std; default to libm so the crate
# builds on its own. The desktop backend adds std on top.
default = ["libm"]
libm = ["slint/libm"]
std = ["slint/std"]

[dependencies]
slint = { path = "../../../api/rs/slint", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded"] }

[build-dependencies]
slint-build = { path = "../../../api/rs/build", features = ["sdf-fonts"] }

[dev-dependencies]
slint = { path = "../../../api/rs/slint", default-features = false, features = ["std", "compat-1-2", "renderer-software", "unsafe-single-threaded"] }
