[package]
name = "slint-safeui-ffi"
version = "1.18.0"
edition = "2024"
publish = false
build = "build.rs"
license = "MIT"

[lib]
name = "slint_safeui_ffi"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
default = []
cs-cortex-m = ["cortex-m/critical-section-single-core"]
libm = ["slint/libm", "slint-safeui-app/libm"]
std = ["slint/std", "slint-safeui-app/std"]
panic-handler = []
pixel-bgra8888 = []
pixel-rgb565 = []
pixel-rgb888 = []

[dependencies]
bytemuck = "1.24.0"
critical-section = "1.2.0"
cortex-m = { version = "0.7.7", optional = true }
heapless = "0.9.2"
riscv = { version = "0.16.0", optional = true }
slint = { path = "../../../api/rs/slint", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded"] }
slint-safeui-app = { path = "../app" }

[build-dependencies]
bindgen = "0.72.1"
