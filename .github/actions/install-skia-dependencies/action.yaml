---
name: Install Skia dependencies
description: Set up dependencies needed to build Skia

runs:
    using: composite
    steps:
        # bindgen takes the clang resource headers (mmintrin.h & friends) from CLANG_PATH or the clang on PATH.
        # A libclang from another LLVM may not know their builtins.
        - name: Use the libclang and clang bundled with Visual Studio
          if: runner.os == 'Windows'
          run: |
              vs=$(cygpath -u "$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)")
              case "$RUNNER_ARCH" in
                  ARM64) libclang_dir="$vs/VC/Tools/Llvm/ARM64/bin" ;;
                  *) libclang_dir="$vs/VC/Tools/Llvm/x64/bin" ;;
              esac
              if [ -f "$libclang_dir/libclang.dll" ]; then
                  win_dir=$(cygpath -w "$libclang_dir")
                  echo "LIBCLANG_PATH=$win_dir" >> $GITHUB_ENV
                  echo "CLANG_PATH=$win_dir\\clang.exe" >> $GITHUB_ENV
              else
                  echo "::warning::No libclang.dll in $libclang_dir, bindgen uses the preinstalled LLVM"
              fi
          shell: bash
        # See https://github.com/ilammy/msvc-dev-cmd?tab=readme-ov-file#caveats
        - name: Remove GNU link.exe from GH actions
          if: runner.os == 'Windows'
          run: rm /usr/bin/link
          shell: bash
        - name: Unselect homebrew clang to work around https://github.com/actions/runner-images/issues/13827
          if: runner.os == 'macOS'
          shell: bash
          run: |
              echo "CLANGCC=/usr/bin/clang" >> $GITHUB_ENV
              echo "CLANGCXX=/usr/bin/clang++" >> $GITHUB_ENV
              libclang_path=$(xcode-select --print-path)/Toolchains/XcodeDefault.xctoolchain/usr/lib/
              echo "LIBCLANG_PATH=$libclang_path" >> $GITHUB_ENV
