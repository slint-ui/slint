---
name: Install Sparkle
description: >
    Put Sparkle.framework in the repository root, where the "sparkle-updater"
    feature of slint-lsp and the visual editor packaging expect it. Does nothing
    outside of macOS, so it is safe to call from a workflow that runs on several
    platforms.

runs:
    using: composite
    steps:
        # Downloads fail often enough on the runners to be worth caching a copy.
        # The key covers the script because that is where the version and its
        # checksum are pinned, so a bump invalidates the entry on its own.
        # There are deliberately no restore-keys: an entry for another version
        # would still look complete to the script below, which would then skip
        # the download and leave the wrong Sparkle in place.
        - name: Restore Sparkle.framework
          if: runner.os == 'macOS'
          uses: actions/cache@v6
          with:
              path: |
                  Sparkle.framework
                  sparkle-bin
              key: ${{ runner.os }}-${{ runner.arch }}-sparkle-${{ hashFiles('scripts/download-sparkle.sh') }}

        # A no-op once the cache restored both directories.
        - name: Download Sparkle.framework
          if: runner.os == 'macOS'
          shell: bash
          run: ./scripts/download-sparkle.sh
