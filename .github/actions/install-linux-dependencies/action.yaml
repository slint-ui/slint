# cSpell: ignore libxcb libxkbcommon xfixes libgbm
---
name: Install Linux dependencies
description: Set up Linux dependencies for Slint

inputs:
    extra-packages:
        description: "Extra packages to install"
        required: false
        default: ""
    force-gcc-10:
        description: 'Force GCC version 10 (default: "no")'
        required: false
        default: "no"

runs:
    using: composite
    steps:
        - name: Configure network retries
          shell: bash
          run: bash "$GITHUB_ACTION_PATH/../network-retries.sh"
        # The Azure Ubuntu mirror is sometimes so slow that a download of a few
        # dozen MB exceeds the apt timeout, so keep the downloaded packages in the
        # GitHub cache. Steps after this action that run apt-get use it too.
        - name: Configure apt download cache
          id: apt-cache
          if: runner.os == 'Linux'
          shell: bash
          env:
              EXTRA_PACKAGES: ${{ inputs.extra-packages }}
          run: |
              dir="$RUNNER_TEMP/apt-archives"
              mkdir -p "$dir/partial"
              # The _apt user can't reach the runner's home directory.
              printf 'Dir::Cache::Archives "%s";\nAPT::Sandbox::User "root";\n' "$dir" \
                  | sudo tee /etc/apt/apt.conf.d/81-ci-archive-cache > /dev/null
              packages=$(printf '%s' "$EXTRA_PACKAGES" | sha1sum | cut -c1-8)
              # Cache keys can't contain commas.
              prefix="apt-${GITHUB_WORKFLOW//,/}-${{ github.job }}-$ImageOS-${{ runner.arch }}-$packages-"
              echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
              echo "key=$prefix$ImageVersion" >> "$GITHUB_OUTPUT"
        - name: Cache apt downloads
          if: runner.os == 'Linux'
          uses: actions/cache@v6
          with:
              path: ${{ runner.temp }}/apt-archives/*.deb
              key: ${{ steps.apt-cache.outputs.key }}
              restore-keys: ${{ steps.apt-cache.outputs.prefix }}
        - name: Install Linux dependencies
          if: runner.os == 'Linux'
          shell: bash
          run: |
              bash "$GITHUB_ACTION_PATH/../apt-get-retry.sh" update
              # Drop the cached packages that newer versions replaced.
              sudo apt-get autoclean
              # libwayland-dev is for the crates that link libwayland at build
              # time instead of dlopen'ing it the way our winit backend does.
              # rfd, which slint-lsp uses for its file dialogs, is one: it pins
              # wayland-backend's "client_system". The bevy examples need it too.
              bash "$GITHUB_ACTION_PATH/../apt-get-retry.sh" install -y --no-install-recommends libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libinput-dev libgbm-dev libfontconfig-dev libseat-dev libsystemd-dev libwayland-dev ${{ inputs.extra-packages }}
        - name: Install C++ compiler
          if: ${{ (runner.os == 'Linux') && (inputs.force-gcc-10 == 'true') }}
          shell: bash
          run: |
              bash "$GITHUB_ACTION_PATH/../apt-get-retry.sh" install -y --no-install-recommends gcc-10 g++-10
              echo "CC=gcc-10" >> $GITHUB_ENV
              echo "CXX=g++-10" >> $GITHUB_ENV
