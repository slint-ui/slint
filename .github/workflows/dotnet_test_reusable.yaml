name: .NET Test (Reusable)

on:
    workflow_call:
      inputs:
        name:
            description: 'Name of the job'
            required: true
            type: string
        os:
            description: 'Operating system to run on'
            required: true
            type: string

env:
    RUSTFLAGS: -D warnings
    CARGO_PROFILE_DEV_DEBUG: 0
    CARGO_INCREMENTAL: false
    RUST_BACKTRACE: full
    SLINT_BACKEND: testing
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    DOTNET_NOLOGO: 1

jobs:
    dotnet_test:
        name: ${{ inputs.name }}
        runs-on: ${{ inputs.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-linux-dependencies
            - uses: ./.github/actions/setup-rust
              with:
                  key: x-dotnet-v0
            - uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 10.0.401
            - name: Build the native library and slint-compiler
              run: cargo build -p slint-dotnet --features testing -p slint-compiler
            - name: Check the formatting
              working-directory: api/dotnet
              run: dotnet format Slint.slnx --verify-no-changes
            - name: Run the .NET tests
              working-directory: api/dotnet
              run: dotnet test --project Slint.Tests
            - name: Build the examples
              run: dotnet build examples/dotnet.slnx
            - name: Check the formatting of the examples
              run: dotnet format examples/dotnet.slnx --verify-no-changes
            - name: Start the examples
              run: dotnet run examples/dotnet-smoke-test.cs -- examples/dotnet.slnx
            # The kernel's virtual display driver, vkms, stands in for the display of a device without a desktop.
            # The kernel of Ubuntu 22.04 has it in linux-modules-extra.
            - name: Start the todo example on linuxkms
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  if ! sudo modprobe vkms; then
                      sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
                      sudo modprobe vkms
                  fi
                  # linuxkms opens the DRM device and the input devices, which needs root without a seat manager.
                  sudo env "PATH=$PATH" "DOTNET_ROOT=$DOTNET_ROOT" SLINT_BACKEND=linuxkms-software \
                      SLINT_DEBUG_PERFORMANCE=console,refresh_full_speed \
                      timeout 10 examples/todo/dotnet/bin/Debug/net10.0/Todo > linuxkms.log 2>&1 || [ $? = 124 ]
                  cat linuxkms.log
                  if grep -qE 'panicked|Unhandled exception|Error' linuxkms.log; then
                      echo "::error::The todo example failed on linuxkms"
                      exit 1
                  fi
                  grep -q 'frames per second' linuxkms.log || { echo "::error::The todo example rendered no frame on linuxkms"; exit 1; }
            # The publish workflow builds apps from the templates, since they need the packages; this checks that each one instantiates.
            - name: Check the dotnet new templates
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  dotnet pack api/dotnet/Templates -o "$RUNNER_TEMP/templates" -p:Version=0.0.0-ci
                  dotnet new install "$RUNNER_TEMP/templates/Slint.Templates.0.0.0-ci.nupkg"
                  cd "$RUNNER_TEMP"
                  dotnet new slint -o Desktop --no-restore
                  dotnet new slint-android -o Android --no-restore
                  dotnet new slint-ios -o IOSApp --no-restore
                  dotnet new slint-xplat -o XPlat --no-restore
                  dotnet new slint-xplat -o Two --platforms desktop --platforms android --style fluent --app-id com.example.two --no-restore
                  if grep -rnE 'SLINT_[A-Z_]+|@Slint[A-Za-z]+@' Desktop Android IOSApp XPlat Two; then
                      echo "::error::A template left a placeholder in the app"
                      exit 1
                  fi
                  [ ! -e Two/Two.iOS ] && ! grep -q iOS Two/Two.slnx || { echo "::error::slint-xplat created the iOS project without --platforms ios"; exit 1; }
                  grep -q '<SlintStyle>fluent</SlintStyle>' Two/Directory.Build.props || { echo "::error::slint-xplat ignored --style"; exit 1; }
                  grep -q '<ApplicationId>com.example.two</ApplicationId>' Two/Two.Android/Two.Android.csproj || { echo "::error::slint-xplat ignored --app-id"; exit 1; }
            - name: Run the .NET test driver
              run: cargo test --manifest-path tests/Cargo.toml -p test-driver-dotnet
