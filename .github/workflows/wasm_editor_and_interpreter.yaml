---
name: Build and test the slintpad and required WASM binaries

on:
    workflow_dispatch:
        inputs:
            release:
                type: boolean
                default: true
                description: "Build the WASM binaries with the release profile"
    workflow_call:
        inputs:
            release:
                type: boolean
                default: true
jobs:
    wasm:
        env:
            CARGO_PROFILE_RELEASE_OPT_LEVEL: s
            CARGO_INCREMENTAL: false
            # Fat LTO minimizes the published WASMs; PR runs use the faster
            # cargo defaults, still small enough for the preview deployment.
            CARGO_PROFILE_RELEASE_LTO: ${{ inputs.release && 'fat' || 'false' }}
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.release && '1' || '16' }}
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-linux-dependencies
            - uses: pnpm/action-setup@v6.0.10
            - uses: actions/setup-node@v7
              with:
                node-version: 24
                package-manager-cache: false
            - uses: ./.github/actions/setup-rust
              with:
                  target: wasm32-unknown-unknown
            - name: Install wasm-pack
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

            - name: Compile slint-wasm-interpreter
              run: wasm-pack build --release --target web -- --features console_error_panic_hook
              working-directory: api/wasm-interpreter

            - name: Build slint-wasm-lsp
              env:
                  SLINT_STYLE: fluent-light
              run: pnpm build:wasm_lsp-release
              working-directory: tools/slintpad

            - name: "Upload wasm Artifacts"
              uses: actions/upload-artifact@v7
              with:
                  name: wasm
                  path: |
                      api/wasm-interpreter/pkg/
                      tools/lsp/pkg/

    build-slintpad:
        needs: [wasm]
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: 24
                package-manager-cache: false
            - uses: pnpm/action-setup@v6.0.10
            - name: Download wasm_lsp Artifacts
              uses: actions/download-artifact@v8
              with:
                  name: wasm
            - name: Install NPM dependencies
              run: pnpm install --frozen-lockfile
              working-directory: tools/slintpad
            - name: Install playwright dependencies
              run: pnpm exec playwright install --with-deps
              working-directory: tools/slintpad
            - name: Compile slintpad
              run: pnpm build
              working-directory: tools/slintpad
            - name: Smoke-Test slintpad
              run: pnpm exec playwright test
              working-directory: tools/slintpad
            - name: Publish Test Summary Results
              if: ${{ always() }}
              working-directory: tools/slintpad
              run: npx github-actions-ctrf playwright-report/ctrf-report.json
            - name: "Upload Playwright Report"
              if: ${{ failure() }}
              uses: actions/upload-artifact@v7
              with:
                  name: slintpad-playwright-report
                  path: |
                      tools/slintpad/playwright-report/
                      tools/slintpad/test-results/
            - name: "Upload slintpad Artifacts"
              uses: actions/upload-artifact@v7
              with:
                  name: slintpad
                  path: tools/slintpad/dist/

