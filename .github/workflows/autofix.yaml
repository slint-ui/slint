name: autofix.ci  # needed to securely identify the workflow

on:
  pull_request:
    branches: [master, "feature/*", "pre-release/*"]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
    CARGO_INCREMENTAL: false
    CARGO_PROFILE_DEV_DEBUG: 0
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    format_fix:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 5
        permissions: &check_permissions
            contents: read
            pull-requests: read
        # The ci workflow waits for this gate anyway, so computing the filter
        # here instead of in a job of its own costs no extra latency.
        outputs:
            changes: ${{ steps.filter.outputs.changes }}
        steps:
            - uses: useblacksmith/checkout@v1
            # paths-filter reads the filter file from the working tree. It gets
            # PR changes from the GitHub API and compares Git refs for other events.
            - &path_filter
              uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: .github/ci_path_filters.yaml
                  predicate-quantifier: some-with-excludes
            - uses: jdx/mise-action@v5.2.8
              with:
                version: 2026.11.1
                log_level: debug
            - name: Install rust dependencies
              run: rustup toolchain install stable-x86_64-unknown-linux-gnu --profile default
            - &restore_pnpm_verification
              name: Restore pnpm lockfile verification
              if: &run_js ${{ github.event_name != 'pull_request' || steps.filter.outputs.changes == '[]' || steps.filter.outputs.autofix_js == 'true' }}
              uses: actions/cache/restore@v6
              with:
                  path: ~/.cache/pnpm/lockfile-verified.jsonl
                  key: pnpm-verification-v1-${{ hashFiles('.mise/config.toml', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '**/.npmrc', '**/.pnpmfile.*') }}
            - name: Run fixes
              env:
                  RUN_JS: *run_js
                  RUN_CARGO_LOCKS: ${{ github.event_name != 'pull_request' || steps.filter.outputs.changes == '[]' || steps.filter.outputs.autofix_cargo_locks == 'true' }}
                  SLINT_SKIP_PNPM_DEDUPE: ${{ steps.filter.outputs.pnpm_manifests != 'true' }}
              run: |
                  tasks=(ci:autofix:fix:base)
                  if [[ "$RUN_JS" == true ]]; then
                      tasks+=(::: ci:autofix:fix:js)
                  fi
                  if [[ "$RUN_CARGO_LOCKS" == true ]]; then
                      tasks+=(::: ci:autofix:fix:cargo-locks)
                  fi
                  mise run --force "${tasks[@]}"
            - name: Suggest format changes
              uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a

    lint_typecheck:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 5
        permissions: *check_permissions
        steps:
            - uses: useblacksmith/checkout@v1
            - *path_filter
            - uses: jdx/mise-action@v5.2.8
              with:
                version: 2026.11.1
                log_level: debug
            - name: Install rust dependencies
              run: rustup toolchain install stable-x86_64-unknown-linux-gnu --profile default
            - *restore_pnpm_verification
            - name: Run lints
              env:
                  RUN_JS: *run_js
              run: |
                  tasks=(ci:autofix:lint:base)
                  if [[ "$RUN_JS" == true ]]; then
                      tasks+=(::: ci:autofix:lint:js)
                  fi
                  mise run --force "${tasks[@]}"
            - name: Spell check
              uses: streetsidesoftware/cspell-action@v9
              with:
                incremental_files_only: true

    ci:
        needs: [format_fix, lint_typecheck]
        permissions:
            contents: read
            deployments: write
            id-token: write
        uses: ./.github/workflows/ci.yaml
        with:
            full: false
            changes: ${{ needs.format_fix.outputs.changes }}

    done:
        # Note: We use `needs` + `if: always()` here to ensure the "done"
        # task is never just "skipped", which would count as success().
        # Instead, make the task fail if any job did not succeed. A cancelled
        # job (e.g. a GitHub-side abort) must fail the gate too: it is not a
        # passing result, so treating it as success would let a change land
        # without that check actually running.
        needs: [ci, format_fix, lint_typecheck]
        if: ${{ always() }}
        name: done
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
              run: echo "A required check failed or was cancelled! 🌋" && false
            - if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
              run: echo "All checks passed. 🎉"
