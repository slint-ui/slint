name: CI

on:
    workflow_dispatch:
        inputs:
            full:
                type: boolean
                default: true
                description: "Run full CI including extended tests (false only runs the jobs matching the `changes` input)"
            changes:
                description: "JSON list of the matched groups from ci_path_filters.yaml (computed by autofix.ci for PRs)"
                type: string
                default: '[]'
    workflow_call:
      inputs:
        full:
            type: boolean
            default: false
        changes:
            description: "JSON list of the matched groups from ci_path_filters.yaml"
            type: string
            default: '[]'
      secrets:
        CLOUDFLARE_API_TOKEN:
          required: true
        CLOUDFLARE_ACCOUNT_ID:
          required: true
        CLOUDFLARE_API_TOKEN_2:
          required: true
        CLOUDFLARE_ACCOUNT_ID_2:
          required: true
        ANDROID_KEYSTORE_PASSWORD:
          required: true
        ANDROID_KEYSTORE_BASE64:
          required: true
        READ_WRITE_PRIVATE_KEY:
          required: true
        SLINT_TESTING_TOKEN:
          required: true

env:
    MACOSX_DEPLOYMENT_TARGET: "11.0"
    SLINT_COMPILER_DENY_WARNINGS: 1
    SLINT_BUILD_NUMBER: ${{ github.run_number }}
    RUST_BACKTRACE: 1
    # Speed up CI builds and keep the target directory small.
    CARGO_INCREMENTAL: false
    CARGO_PROFILE_DEV_DEBUG: 0

jobs:
    visual_editor:
        if: ${{ contains(fromJSON(inputs.changes), 'visual_editor') }}
        name: Visual Editor (${{ matrix.suite }})
        strategy:
            fail-fast: false
            matrix:
                suite: [rust, ui]
        runs-on: macos-14
        timeout-minutes: 120
        env:
            RUSTFLAGS: -D warnings
            SLINT_EMIT_DEBUG_INFO: '1'
            # The UI tests need a private package that GitHub doesn't hand the
            # token for to pull requests from forks. Lint and build the editor
            # there anyway, and skip only the steps that need the token.
            UI_TESTS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/install-skia-dependencies
            - uses: ./.github/actions/setup-rust
              with:
                  components: clippy
                  key: x-visual-editor-v1-${{ matrix.suite }}
                  save_if: ${{ github.ref == 'refs/heads/master' || github.head_ref == 'nigel/visual-editor-ci-overlap-experiment' }}
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.11'
            - uses: astral-sh/setup-uv@v7
              if: matrix.suite == 'ui'
            - name: Install UI test dependencies
              if: ${{ matrix.suite == 'ui' && env.UI_TESTS == 'true' }}
              working-directory: tools/editor/ui-tests
              env:
                  UV_INDEX: slint-private=https://testing.slint.dev/simple/
                  UV_INDEX_SLINT_PRIVATE_USERNAME: __token__
                  UV_INDEX_SLINT_PRIVATE_PASSWORD: ${{ secrets.SLINT_TESTING_TOKEN }}
              run: uv sync --locked
            - name: Run Visual Editor checks
              run: python3 scripts/visual_editor_ci.py ${{ matrix.suite }}
            - name: Upload timing reports and logs
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: visual-editor-${{ matrix.suite }}-timings
                  path: target/visual-editor-ci/
                  if-no-files-found: warn
                  retention-days: 7
