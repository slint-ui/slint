name: Visual Editor Linux package

on:
    workflow_dispatch:
        inputs:
            save_if:
                description: "Condition to save the cache"
                required: false
                type: boolean
                default: true

    pull_request:
        branches:
            - visual-editor

permissions:
    contents: read

jobs:
    flatpak:
        name: Build flatpak ${{ matrix.arch }}
        strategy:
            # Report both architectures instead of hiding one behind the
            # other's failure.
            fail-fast: false
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-latest
                    - arch: aarch64
                      # arm64 runners are free for public repositories, but the
                      # label does not resolve in private ones.
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        container:
            image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
            options: --privileged
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@v6

            # The checkout is owned by a different uid than the one the container
            # runs as, and git refuses to look at repositories of other users
            - name: Mark the checkout safe for git
              run: git config --global --add safe.directory '*'

            # Only needed for `cargo metadata` in the source generators; the build
            # itself uses the toolchain of the rust-stable SDK extension
            - uses: ./.github/actions/setup-rust
              with:
                  key: visual-editor-linux-flatpak-rust-${{ matrix.arch }}
                  save_if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || inputs.save_if }}

            - name: Restore flatpak-builder state
              uses: actions/cache@v4
              with:
                  key: slint-visual-editor-linux-flatpak-${{ matrix.arch }}
                  path: .flatpak-builder

            - name: Generate the flatpak source lists
              run: scripts/generate_visual_editor_flatpak_sources.bash

            - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
              with:
                  bundle: slint-visual-editor-${{ matrix.arch }}.flatpak
                  manifest-path: tools/lsp/dev.slint.VisualEditor.yml
                  arch: ${{ matrix.arch }}
                  cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
                  state-dir: .flatpak-builder
                  upload-artifact: true
