# Run full CI on active branches 3x/day, only if they have recent changes,
# and delete the master Rust caches that newer ones replace
name: Scheduled CI

on:
  schedule:
    # Pull requests share the organization's concurrent job limit with these runs,
    # so they start before, in the middle of, and after the European working day.
    # 4:18 UTC = ~5:00-6:00 CET, 11:18 UTC = ~12:00-13:00 CET, 18:18 UTC = ~19:00-20:00 CET
    - cron: '18 4,11,18 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Specific branch to test (blank = auto-discover active branches)'
        type: string
        default: ''

jobs:
  discover-and-trigger:
    if: github.repository == 'slint-ui/slint'
    runs-on: ubuntu-latest
    steps:
      # GitHub doesn't start workflows from the events of a run dispatched with GITHUB_TOKEN.
      # notify_ci_failure.yaml needs the runs to be dispatched with a GitHub App token.
      - name: Create a token to dispatch with
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: read

      # Swatinem/rust-cache ends its keys with a hash of the lock files and manifests,
      # so each dependency change leaves the previous master cache behind. Keep only
      # the newest cache per job, OS and toolchain.
      - name: Delete superseded Rust caches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh cache list --repo ${{ github.repository }} --ref refs/heads/master --key v0-rust- --limit 1000 \
              --json id,key,createdAt \
              --jq 'group_by(.key | sub("-[0-9a-f]{8}$"; "")) | .[] | sort_by(.createdAt) | .[:-1][].id' \
          | while read -r id; do
              gh cache delete --repo ${{ github.repository }} "$id" || echo "Could not delete cache $id"
          done

      - name: Trigger CI on branches with recent changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -n "$BRANCH" ]; then
            echo "Triggering full CI for $BRANCH"
            gh workflow run "CI" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f full=true
            exit 0
          fi

          # Trigger CI when the branch tip differs from the tip the last CI run
          # tested. This is independent of commit timestamps, so it catches
          # rebase-and-merge or late merges that a time window would miss.
          gh api repos/${{ github.repository }}/branches --paginate \
            -q '.[] | select(.name | test("^(master|feature/|pre-release/)")) | .name + " " + .commit.sha' \
          | while read -r branch head_sha; do
            last_sha=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yaml/runs?branch=$branch&event=workflow_dispatch&per_page=1" -q '.workflow_runs[0].head_sha // ""') || last_sha=""
            if [ "$head_sha" != "$last_sha" ]; then
              echo "Triggering full CI for $branch ($head_sha, last CI ran on ${last_sha:-none})"
              # Old branches may have a ci.yaml that does not accept the `full`
              # input; a failed dispatch must not abort the loop for the
              # remaining branches.
              gh workflow run "CI" --repo ${{ github.repository }} --ref "$branch" -f full=true \
                || echo "Warning: failed to trigger CI for $branch"
            else
              echo "No changes on $branch since last CI ($head_sha), skipping"
            fi
          done
