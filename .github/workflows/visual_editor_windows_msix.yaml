name: Visual Editor Windows MSIX

on:
  workflow_dispatch:
    inputs:
      save_if:
        description: "Condition to save the cache"
        required: false
        type: boolean
        default: true

  pull_request:
    branches:
      - visual-editor

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: false
  SLINT_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  msix:
    # The package is deliberately left unsigned: the Microsoft Store signs it on
    # ingestion. For that to be accepted, `Identity/Publisher` in
    # tools/lsp/Package.appxmanifest.hbs has to match the publisher identity
    # assigned by Partner Center.
    name: Build MSIX
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      # Installing stable toolchain isn't necessary on `windows-latest`

      # For `cargo -Zscript`
      - uses: ./.github/actions/setup-rust
        with:
          key: visual-editor-windows-msix
          toolchain: nightly
          save_if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || inputs.save_if }}

      - uses: microsoft/setup-WinAppCli@v0.1

      - name: Build app for Windows
        shell: pwsh
        run: |
          cargo +stable build `
            --manifest-path tools/lsp/Cargo.toml `
            --target x86_64-pc-windows-msvc `
            --bin slint-visual-editor `
            --profile package-release `
            --no-default-features `
            --features backend-winit,renderer-skia

      - name: Get cargo version
        id: get_cargo_version
        shell: pwsh
        run: |
          $cargoversion = cargo metadata --manifest-path tools/lsp/Cargo.toml --offline --format-version 1 --no-deps |
            ConvertFrom-Json |
            select -exp packages |
            where name -eq "slint-lsp" |
            select -exp version
          "cargo_version=$cargoversion" >> $env:GITHUB_OUTPUT

      - name: Package app as MSIX
        id: package_msix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/lsp/dist
          New-Item -ItemType Directory -Force tools/lsp/dist/Assets
          # Every asset the manifest references has to end up inside the
          # package layout, otherwise only `winapp pack` can resolve it.
          Copy-Item `
            $(ls tools/lsp/packaging/windows-appx/SlintVisualEditor-Logo*.png | % {$_.FullName}) `
            tools/lsp/dist/Assets/
          Copy-Item target/x86_64-pc-windows-msvc/package-release/slint-visual-editor.exe tools/lsp/dist/slint-visual-editor.exe
          Set-Location tools/lsp
          cargo +nightly -Zscript -q ../../scripts/handlebars.rs `
            -v cargo.version=${{ steps.get_cargo_version.outputs.cargo_version }} `
            -i Package.appxmanifest.hbs `
            -o Package.appxmanifest
          winapp pack ./dist

          # `winapp pack` names the package after `Identity/Name` in the
          # manifest, so match on the extension instead of hardcoding the name.
          Set-Location $env:GITHUB_WORKSPACE
          $msix = @(Get-ChildItem tools/lsp -Filter *.msix)
          if ($msix.Count -ne 1) {
            throw "expected exactly one .msix in tools/lsp, found $($msix.Count)"
          }
          "msix_path=tools/lsp/$($msix[0].Name)" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: slint-visual-editor-windows-msix
          path: ${{ steps.package_msix.outputs.msix_path }}
          if-no-files-found: error
