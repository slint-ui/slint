name: Visual Editor Windows MSIX

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which listing to package for"
        required: false
        default: release
        type: choice
        options:
          - release
          - preview
      publish:
        description: "Submit the package to the Store once it is built"
        required: false
        default: false
        type: boolean
      version:
        # The Store keeps a version reserved even after the package using it is
        # deleted again, so test uploads would otherwise burn release versions.
        description: "Three-part version to package instead of the slint-editor one, e.g. 1.99.0 (release channel only)"
        required: false
        type: string
      save_if:
        description: "Condition to save the cache"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      channel:
        description: "Which listing to package for"
        required: false
        default: release
        type: string
      publish:
        description: "Submit the package to the Store once it is built"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - visual-editor

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      # Report both architectures instead of hiding one behind the other's failure.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            # arm64 runners are free for public repositories, but the label does
            # not resolve in private ones.
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          key: visual-editor-windows-msix-${{ matrix.arch }}
          toolchain: stable
          target: ${{ matrix.target }}
          save_if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || inputs.save_if }}

      - name: Build app for Windows
        shell: pwsh
        run: |
          cargo +stable build `
            --manifest-path tools/editor/Cargo.toml `
            --target ${{ matrix.target }} `
            --profile package-release

      # Only the executable differs per architecture. The packaging job builds
      # the layouts around it, so the assets are not shipped back and forth.
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: slint-visual-editor-${{ matrix.arch }}
          path: target/${{ matrix.target }}/package-release/slint-editor.exe
          if-no-files-found: error

  package:
    # The bundle is deliberately left unsigned: the Microsoft Store signs it on
    # ingestion. For that to be accepted, `Identity/Publisher` in
    # tools/editor/packaging/windows-appx/Package.appxmanifest.in has to match the
    # publisher identity assigned by Partner Center.
    name: Package MSIX bundle
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
      product: ${{ steps.channel.outputs.product }}
    steps:
      - uses: actions/checkout@v6

      # No toolchain is set up here: this job only reads the crate version, and
      # `windows-latest` comes with cargo.

      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          pattern: slint-visual-editor-*
          path: exe

      - name: Determine the channel and version
        id: channel
        shell: pwsh
        run: |
          # The display names below are reserved in Partner Center, one listing
          # at a time, and a package naming one that is not reserved for it is
          # rejected. They read the way they do because that is how they were
          # reserved, so leave them be.
          $channel = "${{ inputs.channel }}"
          if (-not $channel) { $channel = "release" }

          if ($channel -eq "preview") {
            # The preview listing is a product of its own, so it has a version
            # space of its own and nothing to gain from the crate version. Date
            # the builds instead, down to the minute: a version can only ever be
            # submitted once, and re-running a workflow keeps its run number,
            # which would otherwise offer the Store a version it has seen.
            $now = (Get-Date).ToUniversalTime()
            $version = "{0}.{1}.{2}.0" -f $now.ToString("yyyy"), [int]$now.ToString("MMdd"), [int]$now.ToString("HHmm")
            $identity = "Slint.SlintVisualEditorPreview"
            $display = "Slint Visual Editor (Preview)"
            $product = "${{ vars.STORE_PRODUCT_ID_PREVIEW }}"
          } else {
            $crateversion = "${{ inputs.version }}"
            if (-not $crateversion) {
              $crateversion = cargo metadata --manifest-path tools/editor/Cargo.toml --offline --format-version 1 --no-deps |
                ConvertFrom-Json |
                select -exp packages |
                where name -eq "slint-editor" |
                select -exp version
            }
            if ($crateversion -notmatch "^\d+\.\d+\.\d+$") {
              throw "version '$crateversion' is not three numeric fields"
            }
            $version = "$crateversion.0"
            $identity = "Slint.SlintVisualEditor"
            $display = "Slint Visual Editor"
            $product = "${{ vars.STORE_PRODUCT_ID_RELEASE }}"
          }

          # Every field is an integer below 65536, the first one is not 0, and
          # the Store reserves the last one and requires it to be 0.
          if ($version -notmatch "^[1-9]\d*\.\d+\.\d+\.0$") {
            throw "version '$version' is not one the Store accepts"
          }

          Write-Host "Packaging $display $version"
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "identity=$identity" >> $env:GITHUB_OUTPUT
          "display=$display" >> $env:GITHUB_OUTPUT
          "product=$product" >> $env:GITHUB_OUTPUT

      - name: Render the tile images
        shell: pwsh
        run: |
          # Shared with the Linux package, which draws its icon on the square one
          $backdrops = "tools/editor/packaging"
          $tiles = Join-Path $env:RUNNER_TEMP "tiles"
          New-Item -ItemType Directory -Force $tiles | Out-Null

          # Render the logo far larger than any tile and trim it to its ink, so
          # that it can be scaled to a share of the tile rather than of the
          # padding its own viewBox happens to carry. The white one goes on the
          # tiles and on dark taskbars, the blue one on light taskbars.
          $onDark = Join-Path $env:RUNNER_TEMP "logo-on-dark.png"
          $onLight = Join-Path $env:RUNNER_TEMP "logo-on-light.png"
          magick -background none -density 1152 logo/slint-logo-small-dark.svg -trim +repage $onDark
          if ($LASTEXITCODE -ne 0) { throw "rendering the logo failed" }
          magick -background none -density 1152 logo/slint-logo-small-light.svg -trim +repage $onLight
          if ($LASTEXITCODE -ne 0) { throw "rendering the logo failed" }

          function Render($backdrop, $width, $height, $name) {
            $out = Join-Path $tiles $name
            $mark = Join-Path $env:RUNNER_TEMP "mark.png"
            # The logo covers two thirds of the height of every tile, wide ones
            # included, and sits in the middle.
            magick $onDark -resize "x$([int]($height * 0.67))" $mark
            if ($LASTEXITCODE -ne 0) { throw "scaling the logo failed" }
            magick -background none $backdrop -resize "${width}x${height}" `
              $mark -gravity center -composite $out
            if ($LASTEXITCODE -ne 0) { throw "compositing $name failed" }
          }

          function Unplated($logo, $size, $name) {
            $out = Join-Path $tiles $name
            $mark = Join-Path $env:RUNNER_TEMP "mark.png"
            # Nothing is drawn behind these, so the logo stands alone and is
            # given a little room rather than running to the edges.
            magick $logo -resize "x$([int]($size * 0.8))" $mark
            if ($LASTEXITCODE -ne 0) { throw "scaling the logo failed" }
            magick -size "${size}x${size}" xc:none $mark -gravity center -composite $out
            if ($LASTEXITCODE -ne 0) { throw "compositing $name failed" }
          }

          foreach ($size in 44, 71, 150, 310) {
            Render "$backdrops/tile-backdrop.svg" $size $size "SlintVisualEditor-Logo-${size}x${size}.png"
          }
          Render "$backdrops/tile-backdrop.svg" 512 512 "SlintVisualEditor-Logo.png"
          Render "$backdrops/tile-backdrop-wide.svg" 310 150 "SlintVisualEditor-Logo-310x150.png"

          # Windows draws the small logo on a plate of its own making unless the
          # package offers it an unplated one, which is why the icon in the task
          # bar is otherwise a square of accent colour around a tile that
          # already has a background of its own.
          $base = "SlintVisualEditor-Logo-44x44"
          foreach ($size in 16, 24, 32, 48, 256) {
            Render "$backdrops/tile-backdrop.svg" $size $size "$base.targetsize-$size.png"
            Unplated $onDark  $size "$base.targetsize-${size}_altform-unplated.png"
            Unplated $onLight $size "$base.targetsize-${size}_altform-lightunplated.png"
          }

          Get-ChildItem $tiles | ForEach-Object { "  {0,-56} {1,7} bytes" -f $_.Name, $_.Length }

      - name: Assemble package layouts
        shell: pwsh
        run: |
          $version = "${{ steps.channel.outputs.version }}"
          $identity = "${{ steps.channel.outputs.identity }}"
          $display = "${{ steps.channel.outputs.display }}"
          $tiles = Join-Path $env:RUNNER_TEMP "tiles"

          foreach ($arch in "x64", "arm64") {
            $dist = "tools/editor/dist/$arch"
            New-Item -ItemType Directory -Force "$dist/Assets" | Out-Null
            # Everything the manifest refers to has to be inside the layout:
            # `makeappx` resolves those paths within the package, not on disk.
            Copy-Item "$tiles/*.png" "$dist/Assets/"
            Copy-Item "exe/slint-visual-editor-$arch/slint-editor.exe" "$dist/slint-visual-editor.exe"

            # Each slice carries its own manifest, naming the version and the
            # architecture it was built for. Everything else about the slices
            # has to be identical for them to bundle together.
            $manifest = New-Object System.Xml.XmlDocument
            $manifest.Load((Join-Path $PWD "tools/editor/packaging/windows-appx/Package.appxmanifest.in"))
            $manifest.Package.Identity.Version = $version
            $manifest.Package.Identity.SetAttribute("ProcessorArchitecture", $arch)

            # The preview builds go to a listing of their own, which is a
            # separate product with a name of its own. The publisher is the
            # same, both listings belonging to one account.
            $manifest.Package.Identity.SetAttribute("Name", $identity)
            $manifest.Package.Properties.DisplayName = $display
            $manifest.Package.Applications.Application.VisualElements.SetAttribute("DisplayName", $display)

            # Writing the document back out reflows it, so indent it and keep
            # the byte order mark out of a file that other tools have to read.
            $settings = New-Object System.Xml.XmlWriterSettings
            $settings.Indent = $true
            $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
            $writer = [System.Xml.XmlWriter]::Create((Join-Path $PWD "$dist/AppxManifest.xml"), $settings)
            try { $manifest.Save($writer) } finally { $writer.Dispose() }
          }

          Write-Host "Packaging version $version"

      - name: Package app as MSIX bundle
        id: package_msix
        shell: pwsh
        run: |
          $version = "${{ steps.channel.outputs.version }}"

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "makeappx.exe was not found in the Windows SDK." }

          $makepri = Join-Path (Split-Path $makeappx) "makepri.exe"
          if (-not (Test-Path $makepri)) { throw "makepri.exe was not found next to makeappx.exe." }

          Set-Location tools/editor
          $name = ([xml](Get-Content "dist/x64/AppxManifest.xml")).Package.Identity.Name
          New-Item -ItemType Directory -Force bundle-src | Out-Null

          # The qualifiers in the asset file names mean nothing without an index
          # to resolve them through, so build one. Its config lives outside the
          # layout, or it would be packaged along with everything else there.
          $priconfig = Join-Path $env:RUNNER_TEMP "priconfig.xml"
          & $makepri createconfig /cf $priconfig /dq en-US /o
          if ($LASTEXITCODE -ne 0) { throw "makepri createconfig failed" }

          foreach ($arch in "x64", "arm64") {
            $pri = Join-Path $env:RUNNER_TEMP "resources-$arch.pri"
            & $makepri new /pr "dist/$arch" /cf $priconfig /of $pri /o
            if ($LASTEXITCODE -ne 0) { throw "makepri new failed for $arch" }
            Copy-Item $pri "dist/$arch/resources.pri"

            & $makeappx pack /d "dist/$arch" /p "bundle-src/${name}_${version}_$arch.msix" /o
            if ($LASTEXITCODE -ne 0) { throw "packing $arch failed" }
          }

          # Without /bv the bundle is versioned after the clock rather than
          # after what it contains, and the version of the bundle is the one an
          # app is known by once it is submitted.
          $bundle = "${name}_${version}_arm64_x64.msixbundle"
          & $makeappx bundle /d bundle-src /p $bundle /bv $version /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed" }

          Set-Location $env:GITHUB_WORKSPACE
          "msixbundle_path=tools/editor/$bundle" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: slint-visual-editor-windows-msixbundle
          path: ${{ steps.package_msix.outputs.msixbundle_path }}
          if-no-files-found: error

  publish:
    # Submitting is asked for rather than implied: a submission consumes the
    # version it carries for good, and once one is made through the API it has
    # to be carried through the API as well, because changing it in Partner
    # Center leaves it unable to be committed.
    name: Submit to the Store
    needs: package
    if: ${{ inputs.publish && github.repository == 'slint-ui/slint' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check what is configured
        shell: pwsh
        run: |
          $missing = @()
          if (-not "${{ needs.package.outputs.product }}") {
            $missing += "the STORE_PRODUCT_ID_{0} variable" -f "${{ needs.package.outputs.channel }}".ToUpper()
          }
          foreach ($s in "AZURE_AD_TENANT_ID", "AZURE_AD_CLIENT_ID", "AZURE_AD_CLIENT_SECRET", "SELLER_ID") {
            if (-not (Get-Item "env:SECRET_$s" -ErrorAction SilentlyContinue).Value) { $missing += "the $s secret" }
          }
          if ($missing) { throw "nothing was submitted: $($missing -join ', ') is not set" }
          Write-Host "Submitting the ${{ needs.package.outputs.channel }} channel, version ${{ needs.package.outputs.version }}"
        env:
          SECRET_AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SECRET_AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          SECRET_AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          SECRET_SELLER_ID: ${{ secrets.SELLER_ID }}

      - name: Download the bundle
        uses: actions/download-artifact@v8
        with:
          name: slint-visual-editor-windows-msixbundle
          path: bundle

      - uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure the Store CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }

      - name: Submit the bundle
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem bundle -Filter *.msixbundle)
          if ($bundles.Count -ne 1) {
            throw "expected exactly one .msixbundle to submit, found $($bundles.Count)"
          }
          # --uploadTimeout has to be passed even though a default is intended:
          # omitting it hands 0 to the blob client, which cancels every request
          # the instant it starts and fails the upload without transferring a
          # byte. Fixed by msstore-cli#163, unreleased as of v0.4.1, and the
          # option is harmless to keep once that ships.
          msstore publish $bundles[0].FullName -id ${{ needs.package.outputs.product }} --uploadTimeout 300
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }
