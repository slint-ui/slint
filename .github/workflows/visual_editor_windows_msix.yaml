name: Visual Editor Windows MSIX

on:
  workflow_dispatch:
    inputs:
      version:
        # The Store keeps a version reserved even after the package using it is
        # deleted again, so test uploads would otherwise burn release versions.
        description: "Three-part version to package instead of the slint-lsp one, e.g. 1.99.0"
        required: false
        type: string
      save_if:
        description: "Condition to save the cache"
        required: false
        type: boolean
        default: true

  pull_request:
    branches:
      - visual-editor

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: false
  SLINT_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      # Report both architectures instead of hiding one behind the other's failure.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            # arm64 runners are free for public repositories, but the label does
            # not resolve in private ones.
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          key: visual-editor-windows-msix-${{ matrix.arch }}
          toolchain: stable
          target: ${{ matrix.target }}
          save_if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || inputs.save_if }}

      - name: Build app for Windows
        shell: pwsh
        run: |
          cargo +stable build `
            --manifest-path tools/lsp/Cargo.toml `
            --target ${{ matrix.target }} `
            --bin slint-visual-editor `
            --profile package-release `
            --no-default-features `
            --features backend-winit,renderer-skia

      # Only the executable differs per architecture. The packaging job builds
      # the layouts around it, so the assets are not shipped back and forth.
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: slint-visual-editor-${{ matrix.arch }}
          path: target/${{ matrix.target }}/package-release/slint-visual-editor.exe
          if-no-files-found: error

  package:
    # The bundle is deliberately left unsigned: the Microsoft Store signs it on
    # ingestion. For that to be accepted, `Identity/Publisher` in
    # tools/lsp/Package.appxmanifest.in has to match the publisher identity
    # assigned by Partner Center.
    name: Package MSIX bundle
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # No toolchain is set up here: this job only reads the crate version, and
      # `windows-latest` comes with cargo.

      - uses: microsoft/setup-WinAppCli@v0.1

      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          pattern: slint-visual-editor-*
          path: exe

      - name: Determine the package version
        id: get_cargo_version
        shell: pwsh
        run: |
          $cargoversion = "${{ inputs.version }}"
          if ($cargoversion) {
            Write-Host "Packaging $cargoversion instead of the slint-lsp version"
          } else {
            $cargoversion = cargo metadata --manifest-path tools/lsp/Cargo.toml --offline --format-version 1 --no-deps |
              ConvertFrom-Json |
              select -exp packages |
              where name -eq "slint-lsp" |
              select -exp version
          }
          # The fourth field is added below and reserved by the Store, so the
          # three fields here are all that keeps a submission unique.
          if ($cargoversion -notmatch "^\d+\.\d+\.\d+$") {
            throw "version '$cargoversion' is not three numeric fields"
          }
          "cargo_version=$cargoversion" >> $env:GITHUB_OUTPUT

      - name: Set the version in the manifest
        shell: pwsh
        run: |
          Set-Location tools/lsp
          $manifest = New-Object System.Xml.XmlDocument
          $manifest.Load((Join-Path $PWD "Package.appxmanifest.in"))
          $manifest.Package.Identity.Version = "${{ steps.get_cargo_version.outputs.cargo_version }}.0"

          # Writing the document back out reflows it, so indent it and keep the
          # byte order mark out of a file that other tools have to read.
          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Indent = $true
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $writer = [System.Xml.XmlWriter]::Create((Join-Path $PWD "Package.appxmanifest"), $settings)
          try { $manifest.Save($writer) } finally { $writer.Dispose() }

          Write-Host "Packaging version $($manifest.Package.Identity.Version)"

      - name: Assemble package layouts
        shell: pwsh
        run: |
          foreach ($arch in "x64", "arm64") {
            $dist = "tools/lsp/dist/$arch"
            New-Item -ItemType Directory -Force "$dist/Assets" | Out-Null
            # Every asset the manifest references has to end up inside the
            # package layout, otherwise only `winapp pack` can resolve it.
            Copy-Item `
              $(ls tools/lsp/packaging/windows-appx/SlintVisualEditor-Logo*.png | % {$_.FullName}) `
              "$dist/Assets/"
            Copy-Item "exe/slint-visual-editor-$arch/slint-visual-editor.exe" "$dist/slint-visual-editor.exe"
          }

      - name: Package app as MSIX bundle
        id: package_msix
        shell: pwsh
        run: |
          $version = "${{ steps.get_cargo_version.outputs.cargo_version }}.0"
          Set-Location tools/lsp

          foreach ($arch in "x64", "arm64") {
            # `winapp pack` detects the architecture from the executable's PE
            # header and sets `ProcessorArchitecture` accordingly.
            winapp pack --manifest Package.appxmanifest "./dist/$arch"
            if ($LASTEXITCODE -ne 0) { throw "winapp pack failed for $arch" }
          }

          $slices = @(Get-ChildItem -Filter *.msix)
          if ($slices.Count -ne 2) {
            throw "expected one .msix per architecture, found $($slices.Count)"
          }
          New-Item -ItemType Directory -Force bundle-src | Out-Null
          $slices | Move-Item -Destination bundle-src/

          # Bundling through `winapp pack` instead would version the bundle
          # after the clock: it leaves the version to `makeappx`, which falls
          # back to the current date and time when it is not given one. Partner
          # Center tracks a submission by the version of the bundle, so pass the
          # version the slices already carry.
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "makeappx.exe was not found in the Windows SDK." }

          $name = ([xml](Get-Content Package.appxmanifest)).Package.Identity.Name
          $bundle = "${name}_${version}_arm64_x64.msixbundle"
          & $makeappx bundle /d bundle-src /p $bundle /bv $version /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed" }

          Set-Location $env:GITHUB_WORKSPACE
          "msixbundle_path=tools/lsp/$bundle" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: slint-visual-editor-windows-msixbundle
          path: ${{ steps.package_msix.outputs.msixbundle_path }}
          if-no-files-found: error
