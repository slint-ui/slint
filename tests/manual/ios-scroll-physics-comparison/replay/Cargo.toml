[package]
name = "ios-scroll-replay"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dev-dependencies]
slint = { path = "../../../../api/rs/slint", default-features = false, features = ["std", "compat-1-2"] }
i-slint-backend-testing = { path = "../../../../internal/backends/testing", features = ["internal"] }
i-slint-core = { path = "../../../../internal/core", features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(slint_ios_scroll_physics)"] }
