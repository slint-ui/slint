[package]
name = "native-slint-scroll"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
slint = { path = "../../../api/rs/slint", default-features = false, features = ["std", "compat-1-18", "unstable-winit-030", "renderer-skia", "renderer-software"] }
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"

[profile.release]
panic = "abort"
