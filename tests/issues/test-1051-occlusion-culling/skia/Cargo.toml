[package]
name = "test-occlusion-culling-skia"
description = "Regression tests for opaque occlusion culling in PartialRenderer, exercised through Skia's headless CPU/raster backend"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dev-dependencies]
slint-interpreter = { workspace = true, features = ["compat-1-2"] }
i-slint-core = { workspace = true, features = ["std", "testing", "occlusion-culling"] }
# The renderer needs a backend feature to compile on macOS and Windows;
# `opengl` is the one without extra dependencies.
i-slint-renderer-skia = { workspace = true, features = ["testing", "opengl"] }
spin_on = { workspace = true }
