[package]
name = "test-occlusion-culling-software"
description = "Regression tests for opaque occlusion culling in PartialRenderer, exercised through the software renderer"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dev-dependencies]
slint-interpreter = { workspace = true, features = ["compat-1-2"] }
i-slint-core = { workspace = true, features = ["std", "testing", "occlusion-culling"] }
i-slint-renderer-software = { workspace = true, features = ["std", "testing"] }
spin_on = { workspace = true }
