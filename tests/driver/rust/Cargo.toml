[package]
name = "test-driver-rust"
description = "Driver for the rust-based tests in Slint"
authors.workspace = true
# Keep an older edition to ensure the generated code is compatible with users that don't use the latest edition
edition = "2021"
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[[bin]]
path = "main.rs"
name = "test-driver-rust"

# The qt widget tests need the main thread, so they run through
# test_driver_lib::fork_harness; see tests/widgets-qt.rs.
[[test]]
name = "widgets-qt"
harness = false

[features]
default = ["backend-qt"]

build-time = ["i-slint-compiler"]
backend-qt = ["slint/backend-qt"]
live-preview = ["slint/live-preview"]

# cSpell: ignore linkme
[dev-dependencies]
slint = { workspace = true, features = ["std", "compat-1-2"] }
i-slint-backend-testing = { workspace = true, features = ["internal"] }
slint-interpreter = { workspace = true, features = ["std", "compat-1-2", "internal"] }
i-slint-core = { workspace = true, features = ["std"] }
linkme = "0.3"
pollster = "1"
satchel = "0.3"
test_driver_lib = { path = "../driverlib", features = ["fork-harness"] }

[target.'cfg(not(target_os = "wasm"))'.dev-dependencies]
i-slint-backend-qt = { workspace = true }

[build-dependencies]
i-slint-compiler = { workspace = true, features = ["default", "rust", "display-diagnostics", "bundle-translations", "renderer-software"], optional = true }

rayon = { workspace = true }
test_driver_lib = { path = "../driverlib" }
