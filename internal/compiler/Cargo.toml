# cSpell:ignore nalge fdsm nalgebra pathdiff flate

[package]
name = "i-slint-compiler"
description = "Internal Slint Compiler Library"
authors.workspace = true
edition = "2024"
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[features]
default = ["std"]

# Everything but the LLR and its deserialization needs std.
# Without it, the crate is `no_std` and only provides what an interpreter needs to run
# a compilation unit deserialized with `llr::serialize`.
std = [
  "i-slint-common/color-parsing",
  "i-slint-common/markdown",
  "dep:num_enum",
  "dep:icu_normalizer",
  "dep:icu_properties",
  "dep:unicode-segmentation",
  "dep:rowan",
  "dep:lyon_path",
  "dep:lyon_extra",
  "dep:by_address",
  "dep:itertools",
  "dep:url",
  "dep:indexmap",
  "dep:serde_json",
  "dep:data-url",
  "once_cell/std",
  "serde/std",
  "smol_str/std",
  "strum/std",
  "typed-index-collections/std",
]

# Generators
cpp = ["std"]
rust = ["std", "quote", "proc-macro2", "dep:syn"]
python = ["std", "dep:pathdiff", "smol_str/serde", "dep:flate2", "dep:base64"]
typescript = ["std"]

# Keep the documentation of the builtin elements in the binary, for hover documentation
# and doc generation.
builtin-docs = ["std"]

# Safety-critical subset: enables the SlintSc output format and compile-time checks.
# The `image` crate decodes `@image-url()` images at compile time.
slint-sc = ["std", "quote", "proc-macro2", "proc-macro2/span-locations", "image"]

# Support for proc_macro spans in the token (only useful for use within a proc macro)
proc_macro_span = ["std", "quote", "proc-macro2"]

# Feature to print the diagnostics to the console
display-diagnostics = ["std", "dep:annotate-snippets"]

# Enable the support to render images and font in the binary
renderer-software = [
  "std",
  "image",
  "dep:resvg",
  "dep:swash",
  "dep:skrifa",
  "i-slint-common/shared-fontique",
  "i-slint-common/svg-text",
  "dep:rayon",
]
# Enable `image`'s default feature set (additional codecs). This is enabled by
# default by `slint-build` and the `slint-compiler` binary for compatibility, but
# can be opted out from to keep builds minimal.
image-default-formats = ["image?/default-formats"]
# Enable support to embed the fonts as signed distance fields
sdf-fonts = ["renderer-software", "dep:fdsm", "dep:fdsm-ttf-parser", "dep:nalgebra", "dep:rayon"]

# Translation bundler
bundle-translations = ["std", "dep:rspolib", "i-slint-common/locale-decimal-separator"]

# Serialize the LLR (`llr::serialize`), for sending a compiled unit to another process
serde = [
  "serde/rc",
  "dep:postcard",
  "either/serde",
  "smol_str/serde",
  "typed-index-collections/serde-alloc",
  "url?/serde",
]

# Enable experimental library module support
experimental-library-module = ["std"]

[dependencies]
i-slint-common = { workspace = true }

num_enum = { version = "0.7", optional = true }
icu_normalizer = { workspace = true, optional = true }
icu_properties = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
strum = { workspace = true }
rowan = { version = "0.17.0", optional = true }
smol_str = { workspace = true }
derive_more = { workspace = true }
annotate-snippets = { version = "0.12.9", optional = true }
quote = { version = "1.0", optional = true }
proc-macro2 = { version = "1.0.17", optional = true }
syn = { version = "3.0", optional = true, default-features = false, features = ["derive", "parsing", "printing"] }
lyon_path = { workspace = true, optional = true, features = ["std"] }
lyon_extra = { version = "1.0.1", optional = true }
by_address = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
url = { version = "2.2.1", optional = true }
indexmap = { version = "2.14", optional = true }
typed-index-collections = { workspace = true, features = ["alloc"] }
either = { version = "1.13", default-features = false }
once_cell = { version = "1.5", default-features = false, features = ["critical-section"] }

# for processing and embedding the rendered image (texture)
image = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
# font embedding
swash = { workspace = true, optional = true, features = ["scale", "render", "std"] }
skrifa = { workspace = true, optional = true }
fdsm = { version = "0.8.0", optional = true }
fdsm-ttf-parser = { version = "0.2", optional = true }
# Keep in sync with the nalgebra version used by fdsm
nalgebra = { version = "0.34.0", optional = true }
rayon = { workspace = true, optional = true }
# translations
rspolib = { version = "0.1.2", optional = true }

pathdiff = { version = "0.2.3", optional = true }

serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }
flate2 = { version = "1.1.5", optional = true }
base64 = { version = "0.23", optional = true }
data-url = { version = "0.3.2", optional = true }

[dev-dependencies]
i-slint-parser-test-macro = { path = "./parser-test-macro" }

regex = "1.3.7"
serde_json = { workspace = true }
spin_on = { workspace = true }
rayon = { workspace = true }
divan = "0.1.14"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[[bench]]
name = "semantic_analysis"
harness = false
required-features = ["rust"]

[package.metadata.docs.rs]
features = [
  "renderer-software",
  "display-diagnostics",
  "bundle-translations",
  "cpp",
  "rust",
  "python",
  "typescript",
  "experimental-library-module",
]
rustdoc-args = ["--generate-link-to-definition"]
