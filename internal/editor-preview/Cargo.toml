[package]
name = "i-slint-editor-preview"
description = "Shared document model and editing session for the Slint language server and visual editor"
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "lib.rs"

[features]
preview-engine = []
preview-builtin = ["preview-engine"]
preview-process = [
  "preview-builtin",
  "dep:async-compat",
  "dep:slint-interpreter",
  "i-slint-live-preview/preview-session",
]
preview-external = []
## Support the LSP-owned remote preview transport.
preview-remote = []
## Expose the test fixtures so that dependent crates can build on them
testing = ["dep:i-slint-backend-testing", "dep:spin_on"]

[dependencies]
i-slint-compiler = { workspace = true, features = ["display-diagnostics"] }
i-slint-live-preview = { version = "=1.18.0", path = "../live-preview", features = ["protocol", "file-watcher"] }

itertools = { workspace = true }
lsp-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
tracing = { workspace = true }

futures-util = "0.3.32"
async-compat = { version = "0.2.4", optional = true }
slint-interpreter = { workspace = true, features = ["compat-1-2", "internal"], optional = true }

# for the `testing` feature
i-slint-backend-testing = { workspace = true, optional = true }
spin_on = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6.0"
scopeguard = { version = "1.1.0", default-features = false }
tokio = { version = "1.50.0", features = ["io-util", "process", "rt", "sync"] }
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.30"

[dev-dependencies]
i-slint-backend-testing = { path = "../backends/testing" }
spin_on = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]
