# Median wall-clock times in nanoseconds, compared by
# `cargo xtask check_benchmarks`.
#
# The values are measured by the `benchmarks` job in full CI on ubuntu-22.04.
# Seed or refresh them from that job's `benchmark-results` artifact:
#
#   cargo xtask check_benchmarks --from-results benchmark-results.toml --save-baseline
#
# Refresh after intentional performance changes, otherwise the next full CI run
# fails once a median exceeds its entry by the tolerance.

[settings]
# Fail when a median exceeds its baseline value by more than this factor.
tolerance = 1.2

[medians]
