[package]
name = "slint-wasm-interpreter"
description = "Slint wasm glue"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
slint-interpreter = { workspace = true, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "internal"] }
i-slint-backend-winit = { workspace = true }
i-slint-core = { workspace = true }
i-slint-common = { workspace = true, features = ["shared-fontique"] }
send_wrapper = { workspace = true }

vtable = { workspace = true }

console_error_panic_hook = { version = "0.1.6", optional = true }
js-sys = { version = "0.3.44", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "0.4.18" }
wasm-bindgen = { version = "0.2.66" }
web-sys = { workspace = true, features = ["Request", "RequestInit", "RequestMode", "Response", "Window"] }
wuff = { version = "0.2.9", optional = true, default-features = false, features = ["brotli"] }

[features]
# Leave the default font (Inter) out of the binary. No text is drawn until the page passes a font
# to `register_default_font_from_memory`, which the page can download in parallel with the wasm,
# or share with its own CSS.
no-embedded-font = ["i-slint-common/no-embedded-fallback-font"]
# Accept WOFF2 files in `register_font_from_memory` and `register_default_font_from_memory`,
# so that a page can pass the font its CSS already downloaded.
woff2 = ["dep:wuff"]

#[dev-dependencies]
#wasm-bindgen-test = "0.3.13"
