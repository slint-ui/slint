[package]
name = "slint-dotnet"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Slint .NET integration"
repository.workspace = true
homepage.workspace = true
publish = false
rust-version.workspace = true

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]
name = "slint_dotnet"

[features]
# Keep in sync with features in nightly_snapshot.yaml, cpp_package.yaml, slint_tool_binary.yaml, api/node/Cargo.toml, and api/python/slint/Cargo.toml
default = ["backend-linuxkms-libinput", "backend-winit", "renderer-femtovg", "renderer-skia", "accessibility", "live-preview"]

backend-qt = ["slint-interpreter/backend-qt"]
backend-winit = ["slint-interpreter/backend-winit"]
backend-winit-x11 = ["slint-interpreter/backend-winit-x11"]
backend-winit-wayland = ["slint-interpreter/backend-winit-wayland"]
backend-linuxkms = [
  "slint-interpreter/backend-linuxkms",
  "dep:i-slint-backend-linuxkms",
  "i-slint-backend-linuxkms/dlopen",
]
backend-linuxkms-libseat = ["backend-linuxkms", "slint-interpreter/backend-linuxkms-libseat"]
backend-linuxkms-libinput = ["backend-linuxkms", "slint-interpreter/backend-linuxkms-libinput"]
# Selected at run time with SLINT_BACKEND=testing.
backend-testing = ["i-slint-backend-selector/backend-testing"]
# With SLINT_BACKEND=testing, also use the test fonts and report Windows as the OS, like Slint's other test drivers.
testing = ["backend-testing", "dep:i-slint-backend-testing"]
system-testing = ["i-slint-backend-selector/system-testing"]
# Reloads .slint files that change on disk, for the code that `slint-compiler --csharp-live-preview` generates.
live-preview = ["dep:i-slint-live-preview"]
mcp = ["i-slint-backend-selector/mcp"]

renderer-femtovg = ["slint-interpreter/renderer-femtovg"]
renderer-femtovg-wgpu = ["slint-interpreter/renderer-femtovg-wgpu"]
renderer-skia = ["slint-interpreter/renderer-skia"]
renderer-skia-opengl = ["slint-interpreter/renderer-skia-opengl"]
renderer-skia-vulkan = ["slint-interpreter/renderer-skia-vulkan"]
renderer-software = ["slint-interpreter/renderer-software"]
accessibility = ["slint-interpreter/accessibility"]

[dependencies]
i-slint-backend-selector = { workspace = true }
i-slint-core = { workspace = true, features = ["tr"] }
slint-interpreter = { workspace = true, default-features = false, features = ["backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-18", "system-tray", "display-diagnostics"] }
spin_on = { workspace = true }
i-slint-backend-testing = { workspace = true, optional = true, features = ["internal"] }
i-slint-live-preview = { workspace = true, optional = true, features = ["live-component"] }

[target.'cfg(target_os = "linux")'.dependencies]
i-slint-backend-linuxkms = { workspace = true, optional = true }
