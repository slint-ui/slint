      font-display: swap;
    }
    :root {
      color-scheme: light dark;
      --surface: #f4f5f7;
      --text: #15191e;
      --muted: #626973;
      --border: #dce0e5;
      --code-surface: #fff;
      --code-text: #191919;
      --accent: #6d5ce7;
    }
    html, body { margin: 0; background: var(--surface); color: var(--text); }
    body { display: grid; justify-items: center; }
    [hidden] { display: none !important; }
    #tabs { display: flex; width: min(100%, 720px); box-sizing: border-box; padding: 4px 8px 0; gap: 16px; border-bottom: 1px solid var(--border); }
    [role="tab"] { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 8px 4px; font: 13px system-ui; color: var(--muted); cursor: pointer; }
    [role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: currentColor; }
    [role="tabpanel"] { width: min(100%, 720px); min-width: 0; }
    #preview-panel { display: grid; grid-template-columns: 46px minmax(0, 1fr); }
    #preview-panel:has(#color-panel:not([hidden])) { min-height: 246px; }
    #edit-toolbar { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border-right: 1px solid var(--border); }
    #edit-toolbar button { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
    #edit-toolbar button:hover { background: var(--code-surface); color: var(--text); }
    #edit-toolbar button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--code-surface); }
    #edit-toolbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #edit-toolbar button:disabled { opacity: 0.45; cursor: default; }
    #edit-toolbar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    #color-panel { position: absolute; z-index: 2; left: 42px; top: 44px; width: 180px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--code-surface); color: var(--text); box-shadow: 0 4px 18px #00000020; font: 12px/1.4 system-ui; }
    #color-panel label { display: block; margin-bottom: 5px; }
    #color-property { width: 100%; margin-bottom: 10px; padding: 4px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font: inherit; }
    #color-values { display: flex; gap: 6px; }
    #color-input { width: 36px; height: 30px; padding: 1px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); cursor: pointer; }
    #color-hex { width: 0; flex: 1; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); font: 12px "JetBrains Mono", monospace; }
    #color-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
    #color-swatches button { width: 100%; height: 24px; border: 1px solid var(--border); background: var(--swatch); }
    #color-swatches button:hover { background: var(--swatch); outline: 2px solid var(--accent); outline-offset: 1px; }
    #color-hint { margin: 8px 0 0; color: var(--muted); font-size: 11px; }
    #editor-viewport { display: flex; flex-direction: column; min-width: 0; }
    #preview-scroll { box-sizing: border-box; width: 100%; padding: 12px; overflow: auto; overscroll-behavior: contain; }
    #preview-content { position: relative; margin: auto; overflow: hidden; }
    #preview-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; line-height: 0; }
    #preview-stage canvas { display: block; }
    canvas[data-edit="true"] { pointer-events: none; }
    #edit-target { position: absolute; padding: 0; border: 0; outline: none; background: transparent; cursor: text; }
    #label-input { position: absolute; box-sizing: border-box; padding: 0 4px; border: 1px solid var(--accent); border-radius: 3px; outline: none; font: 13px system-ui; text-align: center; }
    #edit-hint { margin: 0; padding: 5px 8px 8px; font: 11px/1.4 system-ui; color: var(--muted); text-align: center; }
    #draft-badge { margin-left: auto; padding: 8px 4px; font: 11px system-ui; color: var(--accent); }
    #code-panel { box-sizing: border-box; height: 320px; overflow: auto; background: var(--code-surface); color: var(--code-text); padding: 12px 16px; }
    #code-panel pre { margin: 0; font: 13px/1.6 "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-ligatures: none; tab-size: 4; }
    #code-panel code { font: inherit; }
    canvas { max-width: none; }
    canvas:focus { outline: none; }
    canvas[data-keyboard-focus="true"]:focus-visible { outline: auto; }
    #status { font: 14px system-ui; padding: 12px; white-space: pre-wrap; }
    #status[hidden] { display: none; }
    #version { font: 11px system-ui; color: var(--muted); padding: 6px 8px; width: min(100%, 720px); box-sizing: border-box; text-align: left; }
    canvas[data-stale="true"] { opacity: 0.45; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #191919;
        --text: #ededed;
        --muted: #ababab;
        --border: #383838;
        --code-surface: #1e1e1e;
        --code-text: #d4d4d4;
      }
    }
  </style>
</head>

    <button id="preview-tab" role="tab" aria-controls="preview-panel" aria-selected="true">Preview</button>

    <span id="draft-badge" hidden>Draft</span>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1 12-12a2.8 2.8 0 0 0-4-4L4 16z"/></svg>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 0-4 2 2 0 0 1 0-4h4a4 4 0 0 0 4-4c0-3-4-6-9-6z"/><circle cx="7" cy="10" r="1"/><circle cx="10" cy="6.5" r="1"/><circle cx="15" cy="7" r="1"/></svg>

          <button type="button" aria-label="Purple" data-color="#9333ea" style="--swatch:#9333ea"></button>
          <button type="button" aria-label="Yellow" data-color="#facc15" style="--swatch:#facc15"></button>
          <button type="button" aria-label="White" data-color="#ffffff" style="--swatch:#ffffff"></button>
          <button type="button" aria-label="Black" data-color="#000000" style="--swatch:#000000"></button>
          <button type="button" aria-label="Gray" data-color="#64748b" style="--swatch:#64748b"></button>

        <p id="color-hint"></p>
      </div>
      <button id="apply-edit" type="button" aria-label="Use these changes" title="Use these changes" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>
      </button>
      <button id="cancel-edit" type="button" aria-label="Cancel changes" title="Cancel changes" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>

            <button id="edit-target" type="button" aria-label="Edit button label" title="Double-click to edit label" hidden></button>
            <input id="label-input" aria-label="Button label" maxlength="256" hidden>
          </div>
        </div>
      </div>
      <p id="edit-hint" role="status" hidden></p>
    </div>
