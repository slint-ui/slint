[package]
name = "slint-tr-extractor"
description = "Extract the @tr strings of .slint files into a gettext .pot file"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = ["gettext", "i18n", "translation", "gui", "ui"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
categories = ["gui", "command-line-utilities", "development-tools"]

[dependencies]
i-slint-compiler = { workspace = true, features = ["default", "display-diagnostics"] }
chrono = { version = "0.4.24", default-features = false, features = ["clock"] }
clap = { workspace = true }
rspolib = "0.1.2"
smol_str = { workspace = true }

[dev-dependencies]
itertools = { workspace = true }
rayon = { workspace = true }
tempfile = "3"

[[bin]]
name = "slint-tr-extractor"
path = "main.rs"
