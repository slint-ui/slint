# F-Droid's rebuild of the viewer has to match ours byte for byte, so the
# compiler is pinned; docs/internal/release.md says when to move it.
[toolchain]
channel = "1.98.1"
targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
profile = "minimal"
