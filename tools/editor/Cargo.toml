# cSpell: ignore nucleo zbus

[package]
name = "slint-editor"
description = "The Slint visual editor"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "slint-editor"
path = "main.rs"

[features]
## Discover preview targets on the local network.
preview-remote = ["dep:mdns-sd"]
## Enable the out-of-process system-testing transport.
system-testing = ["slint/system-testing"]

[dependencies]
i-slint-backend-selector = { workspace = true }
i-slint-common = { workspace = true }
i-slint-compiler = { workspace = true, features = ["display-diagnostics"] }
i-slint-core = { workspace = true, features = ["std"] }
i-slint-editor-preview = { workspace = true, features = ["preview-engine", "preview-builtin"] }
i-slint-live-preview = { workspace = true, features = ["protocol", "file-watcher"] }

by_address = { workspace = true }
clap = { workspace = true }
clru = { workspace = true }
crossbeam-channel = "0.5"
itertools = { workspace = true }
lsp-types = { workspace = true }
nucleo-matcher = "0.3.1"
serde = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true, features = ["compat-1-2", "backend-winit", "renderer-skia", "unstable-winit-030", "raw-window-handle-06"] }
slint-interpreter = { workspace = true, features = ["compat-1-2", "internal", "internal-highlight", "internal-json", "image-default-formats"] }
smol_str = { workspace = true }
tokio = { version = "1.50.0", features = ["macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { path = "../../internal/backends/testing" }
i-slint-editor-preview = { path = "../../internal/editor-preview", features = ["testing"] }
spin_on = { workspace = true }

# Used by the visual editor for the auto-updater.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSToolbar", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSBundle", "NSError"] }
objc2 = "0.6"
raw-window-handle = "0.6"

# Used by the visual editor for the auto-updater: the Flatpak portal is a
# D-Bus service.
# Used by the visual editor for the auto-updater: the Store installs updates in
# the background, and PackageCatalog is how the running process learns that the
# copy it has mounted is now the old one.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["ApplicationModel", "ApplicationModel_Core", "Services_Store", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_Shell"] }
windows-core = "0.62.2"
windows-collections = "0.3.2"
windows-future = "0.3.2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.14.0", default-features = false, features = ["async-io", "blocking-api"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mdns-sd = { version = "0.20.0", default-features = false, optional = true }
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Navigator", "Window"] }
