# cspell:ignore appstreamcli metainfo

# Flatpak manifest for the Slint Visual Editor, with Skia built from source
# inside the sandbox. The two generated source lists it references are not
# checked in; scripts/build_visual_editor_flatpak.bash creates them next to
# this file before invoking flatpak-builder.

id: dev.slint.VisualEditor

runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # Provides clang/clang++ (Skia's supported compiler) and libclang for bindgen
  - org.freedesktop.Sdk.Extension.llvm20

command: slint-visual-editor

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # A .slint file is rarely alone: designs reference images, fonts and other
  # .slint files by relative path, so the portal-based file dialog is not
  # enough to open a project.
  - --filesystem=host
  # The live-preview can attach to an application running outside the sandbox
  - --share=network

# gn is only needed to build Skia; keep it out of the final app
cleanup:
  - /bin/gn

# Applies to all modules: both gn and Skia are built with the llvm20 clang
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin

modules:
  # gn, the meta-build tool needed to configure Skia. Its revision does not
  # need to track Skia's pin (any recent gn works), but
  # scripts/flatpak-skia-generator.py reports the revision Skia's CI uses.
  # disable-shallow-clone keeps the tags gn's build uses for its version stamp.
  - name: gn
    buildsystem: simple
    build-commands:
      - python3 build/gen.py --out-path=out --allow-warnings
      - ninja -C out gn
      - install -Dm0755 out/gn ${FLATPAK_DEST}/bin/gn
    sources:
      - type: git
        url: https://gn.googlesource.com/gn.git
        commit: b2afae122eeb6ce09c52d63f67dc53fc517dbdc8
        disable-shallow-clone: true

  - name: slint-visual-editor
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/slint-visual-editor/cargo
        CARGO_NET_OFFLINE: "true"
        # Points skia-bindings at the pre-synced Skia source tree; this
        # triggers its offline build path (no downloads, no git-sync-deps)
        SKIA_SOURCE_DIR: /run/build/slint-visual-editor/deps/skia-src
        # bindgen needs libclang from the llvm20 SDK extension
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        # Use the gn built by the gn module instead of Skia's prebuilt bin/gn
        # (which the offline build never downloads)
        SKIA_GN_COMMAND: /app/bin/gn
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo build --manifest-path tools/editor/Cargo.toml
        --profile package-release --offline
      - install -Dm0755 target/package-release/slint-editor ${FLATPAK_DEST}/bin/slint-visual-editor
      - install -Dm0644 tools/editor/packaging/linux/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      # The icon references the shared logo and tile backdrop, and librsvg only
      # resolves references within the document's own directory
      - cp logo/slint-logo-small-dark.svg tools/editor/packaging/tile-backdrop.svg tools/editor/packaging/linux/
      - >
        for size in 128 256 512; do
        rsvg-convert -w $size -h $size tools/editor/packaging/linux/${FLATPAK_ID}.svg -o icon-$size.png || exit 1;
        install -Dm0644 icon-$size.png
        ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png || exit 1;
        done
      # Stamp the release the appstream metadata announces from the crate
      # version and the commit date of the checkout being built
      - >
        sed -e "s/@VERSION@/$(cargo metadata --no-deps --offline --format-version 1
        --manifest-path tools/editor/Cargo.toml |
        jq -r '.packages[] | select(.name == "slint-editor") | .version')/"
        -e "s/@DATE@/$(git log -1 --format=%cs)/"
        tools/editor/packaging/linux/${FLATPAK_ID}.metainfo.xml.in > ${FLATPAK_ID}.metainfo.xml
      - appstreamcli validate --no-net ${FLATPAK_ID}.metainfo.xml
      - install -Dm0644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      # Without a ref flatpak-builder would build the default branch, not the
      # commit this manifest sits on; HEAD resolves to the current checkout
      - type: git
        path: ../..
        branch: HEAD
      - cargo-sources.json
      # Skia source tree: the rust-skia fork plus all of Skia's third-party
      # DEPS, each pinned by commit (generated by scripts/flatpak-skia-generator.py)
      - skia-sources.json
