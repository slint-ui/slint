[package]
name = "fieldnotes"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "fieldnotes"
path = "main.rs"

[dependencies]
slint = { path = "../../../../../api/rs/slint", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"

[build-dependencies]
slint-build = { path = "../../../../../api/rs/build" }
