# cSpell: ignore HARDABI WORKQUEUE
CONFIG_MAIN_STACK_SIZE=49152

# Rust's thumbv8m.main-none-eabihf target uses the hard-float ABI.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

CONFIG_INPUT_GT911_INTERRUPT=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256
CONFIG_INPUT_MODE_THREAD=y
CONFIG_INPUT_THREAD_STACK_SIZE=8192
