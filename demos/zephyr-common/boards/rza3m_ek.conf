CONFIG_MAIN_STACK_SIZE=65536
CONFIG_HEAP_MEM_POOL_SIZE=16777216
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8388608

CONFIG_DISPLAY=y
CONFIG_MIPI_DSI=y
CONFIG_GPIO=y

CONFIG_INPUT=y
CONFIG_INPUT_GT911=y

# The board's user switches need an interrupt on both edges, which the RZ/A3M's TINT can't raise.
CONFIG_INPUT_GPIO_KEYS=n
