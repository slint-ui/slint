[package]
name = "printerdemo_mcu"
version = "1.19.0"
authors = ["Slint Developers <info@slint.dev>"]
edition.workspace = true
build = "build.rs"
publish = false
license = "MIT"

[[bin]]
path = "main.rs"
name = "printerdemo_mcu"

[features]
simulator = ["slint/renderer-software", "slint/backend-winit", "slint/std"]
default = ["simulator", "ink-particles"]
box-pixel-snap = []
box-line-damage = ["mcu-board-support/box-line-damage"]
box-pie-fill = ["box-line-damage", "mcu-board-support/box-pie-fill"]
box-bench = ["mcu-board-support/box-profile"]
ink-particles = ["slint/image-pixel-format-rgb565", "dep:bytemuck", "dep:libm"]
box-ink-particles = ["ink-particles", "mcu-board-support/box-parallel"]
box-ink-tilt = ["box-ink-particles", "mcu-board-support/box-imu", "ink-native-assets"]
ink-native-assets = ["ink-particles"]
kiosk-autostart = []

[dependencies]
slint = { path = "../../api/rs/slint", default-features = false, features = ["compat-1-2"] }
mcu-board-support = { path = "../../examples/mcu-board-support" }
bytemuck = { version = "1.13.1", optional = true }
libm = { version = "0.2", optional = true }

[build-dependencies]
slint-build = { path = "../../api/rs/build" }

[dev-dependencies]
divan = "0.1.14"

[[bench]]
name = "bench"
path = "bench.rs"
harness = false
