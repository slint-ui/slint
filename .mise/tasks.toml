# Use https://mise.jdx.dev/schema/mise-task.json for validation.
# cspell:ignore pipx taplo dedupe

### fixes

["fix:cpp:format"]
description = "Run clang format fix on all C++ files"
run = '''fd '.*\.(h|H|hpp|hxx|h\+\+|c|C|cpp|cxx|c\+\+)$' -0 | xargs -0 clang-format -i'''
tools = { "pipx:clang-format" = "20.1.3" }

["fix:rust:lockfile:root"]
description = "Update the main lockfile (if absolutely necessary)"
wait_for = ["fix:toml:format"]
# Use cargo build -p xtask to test if the lockfile needs updating.
# The fix:legal:copyright task needs the xtask anyhow, so this has a double use.
run = "cargo build --locked -p xtask || (echo \"### Updating Main Lockfile! ###\" && cargo update)"

# The examples, demos and tests workspaces each keep their own committed
# Cargo.lock. Use cargo metadata to test whether each lockfile needs updating.
# --format-version suppresses "warning: please specify `--format-version` flag explicitly to avoid compatibility problems"
["fix:rust:lockfile:examples"]
description = "Update the examples workspace lockfile (if absolutely necessary)"
wait_for = ["fix:toml:format"]
run = "cargo metadata --locked --format-version=1 > /dev/null || (echo \"### Updating Examples Lockfile! ###\" && cargo update)"
dir = "examples"

["fix:rust:lockfile:demos"]
description = "Update the demos workspace lockfile (if absolutely necessary)"
wait_for = ["fix:toml:format"]
run = "cargo metadata --locked --format-version=1 > /dev/null || (echo \"### Updating Demos Lockfile! ###\" && cargo update)"
dir = "demos"

["fix:rust:lockfile:tests"]
description = "Update the tests workspace lockfile (if absolutely necessary)"
wait_for = ["fix:toml:format"]
run = "cargo metadata --locked --format-version=1 > /dev/null || (echo \"### Updating Tests Lockfile! ###\" && cargo update)"
dir = "tests"

["fix:legal:copyright"]
description = "Run the check_license_headers --fix xtask"
run = "cargo xtask check_license_headers --fix-it"
depends = ["fix:rust:lockfile:root"]
# Edits the same files as the formatters, so don't run concurrently with them
wait_for = [
  "fix:cpp:format",
  "fix:python:format",
  "fix:rust:format:all",
  "fix:toml:format",
  "fix:ts:format",
  "fix:ts:biome",
]

["fix:python:format"]
description = "Run Ruff fixes and formatting"
# Run via uv as the ruff installation via mise is unreliable in the CI.
# It keeps failing to find ruff, despite saying that it was installed.
# --project picks up the ruff pinned in api/python/slint's dev group so this
# matches the version CI lints with, while still formatting from the repo root.
run = """
uv run --project api/python/slint --only-group dev ruff check --fix tools/editor/ui-tests
uv run --project api/python/slint --only-group dev ruff format
"""

["fix:rust:format"]
description = "Run cargo fmt --all"
run = "cargo fmt --all"

["fix:rust:format:root"]
description = "Run cargo fmt --all"
run = "cargo fmt --all"
dir = "."

["fix:rust:format:bevy"]
description = "Run cargo fmt --all"
run = "cargo fmt --all"
dir = "examples/bevy"

["fix:rust:format:servo"]
description = "Run cargo fmt --all"
run = "cargo fmt --all"
dir = "examples/servo"

["fix:rust:format:safeui"]
description = "Run cargo fmt --all"
run = "cargo fmt --all"
dir = "examples/safe-ui"

["fix:rust:format:all"]
depends = ["fix:rust:format:root", "fix:rust:format:bevy", "fix:rust:format:servo", "fix:rust:format:safeui"]

["fix:toml:format"]
description = "Run taplo format"
run = "taplo format"

["fix:pnpm:lock"]
description = "Update pnpm lock file"
run = "pnpm i --lockfile-only"

["fix:pnpm:dedupe"]
description = "Run pnpm dedupe"
run = '''
if [ "${SLINT_SKIP_PNPM_DEDUPE:-false}" = "true" ]; then
  echo "Skipping pnpm dedupe because no dependency manifest changed"
else
  pnpm dedupe
fi
'''
depends = ["prepare:pnpm-install"]

["fix:ts:format"]
description = "Run pnpm format:fix"
run = "pnpm run format:fix"
depends = ["prepare:pnpm-install"]
wait_for = ["fix:ts:biome"]

["fix:ts:biome"]
description = "Run pnpm lint:fix"
run = "pnpm run lint:fix"
depends = ["prepare:pnpm-install"]

### Lints

["lint:python"]
description = "Run Ruff and ty on the standalone scripts"
# scripts/ has no uv project of its own, so borrow the ruff and ty pinned in
# api/python/slint's dev group, the versions the Python packages are linted with.
# The packages themselves are checked from their own directories in the python
# workflow, which ruff needs to resolve their first-party imports.
run = """
uv run --project api/python/slint --only-group dev ruff check scripts
uv run --project api/python/slint --only-group dev ty check scripts
"""

["lint:spell"]
description = "Run cspell"
run = "pnpm spellcheck"
depends = ["prepare:pnpm-install"]

["lint:ts:typecheck"]
description = "Run pnpm format:fix"
run = "pnpm type-check:ci"
depends = ["prepare:pnpm-install"]

["lint:ts:knip"]
description = "Run knip"
run = "pnpm knip"
depends = ["prepare:pnpm-install"]

### Build

["build:lsp:wasm"]
description = "Build the LSP (WASM)"
dir = "editors/vscode"
sources = [
  "tools/lsp/Cargo.toml",
  "tools/lsp/**/*.rs",
  "tools/lsp/ui/**/*.slint",
  "internal/editor-preview/Cargo.toml",
  "internal/editor-preview/**/*.rs",
]
outputs = ["tools/lsp/pkg/*"]
run = "pnpm run build:wasm_lsp"
tools = { "ubi:wasm-bindgen/wasm-pack" = "0.13.1" }
depends = ["prepare:pnpm-install"]

["build:interpreter:wasm"]
description = "Build the Slint interpreter (WASM)"
dir = "tools/slintpad"
sources = ["api/wasm-interpreter/Cargo.toml", "api/wasm-interpreter/src/**/*.rs"]
outputs = ["api/wasm-interpreter/pkg/*"]
run = "pnpm run build:wasm_interpreter"
tools = { "ubi:wasm-bindgen/wasm-pack" = "0.13.1" }
depends = ["prepare:pnpm-install"]

["prepare:pnpm-install"]
hide = true
run = "pnpm install --frozen-lockfile"
depends = ["fix:pnpm:lock"]
# The reuse check fails on gitignored files (node_modules, .astro) that
# appear while it runs, so everything that generates them waits for it.
wait_for = ["lint:legal:reuse"]


### CI

["ci:autofix:fix"]
description = "CI autofix job -- fix steps"
depends = [
  "fix:cpp:format",
  "fix:legal:copyright",
  "fix:python:format",
  "fix:rust:format:all",
  "fix:text:trailing_spaces",
  "fix:toml:format",
  "fix:pnpm:lock",
  "fix:pnpm:dedupe",
  "fix:ts:biome",
  "fix:ts:format",
  "fix:rust:lockfile:root",
  "fix:rust:lockfile:examples",
  "fix:rust:lockfile:demos",
  "fix:rust:lockfile:tests",
]

["ci:autofix:lint"]
description = "CI autofix job -- lint steps"
depends = ["lint:legal:reuse", "lint:python", "lint:ts:typecheck", "lint:ts:knip"]
